name: docx
version: "1.0"
description: "Word 文档创建技能"

dependencies:
  - python-docx

triggers:
  - "创建 Word 文档"
  - "写报告"
  - "生成 docx"
  - "制作文档"

best_practices: |
  ## Word 文档创建最佳实践

  1. **结构清晰**：使用标题层级组织内容
     - 一级标题：文档主题
     - 二级标题：主要章节
     - 三级标题：子章节

  2. **段落格式**：
     - 每段聚焦一个主题
     - 段落间留空行

  3. **列表使用**：
     - 无序列表用于并列项目
     - 有序列表用于步骤说明

  4. **专业排版**：
     - 中文使用宋体或微软雅黑
     - 英文使用 Times New Roman
     - 正文字号建议 11-12pt

examples:
  - input: "帮我写一份项目总结报告"
    output: |
      我来帮你创建项目总结报告。

      工具：create_docx
      参数：
      ```json
      {
        "filename": "项目总结报告",
        "title": "项目总结报告",
        "content": "# 项目概述\n\n## 项目背景\n...\n\n## 主要成果\n...\n\n## 经验总结\n..."
      }
      ```
